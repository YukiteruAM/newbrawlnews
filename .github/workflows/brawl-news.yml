name: brawl-news
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      meta:
        description: "Опубликовать мету прямо сейчас"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: brawl-news
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BRAWL_API_KEY: ${{ secrets.BRAWL_API_KEY }}
          HCTI_USER_ID: ${{ secrets.HCTI_USER_ID }}
          HCTI_API_KEY: ${{ secrets.HCTI_API_KEY }}
          FORCE_META: ${{ inputs.meta }}
        run: python -u bot.py
      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase
            git push
          fi
