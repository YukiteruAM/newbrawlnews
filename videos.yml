name: videos
on:
  schedule:
    - cron: "40 17 * * *"      # каждый день в 20:40 по Москве, после меты и гайда
  workflow_dispatch:
    inputs:
      kind:
        description: "Что собрать"
        type: choice
        options: [auto, meta, guide, demo]
        default: auto
permissions:
  contents: write
concurrency:
  group: brawl-video
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install --quiet pillow edge-tts gTTS
          (which ffmpeg > /dev/null && which ffprobe > /dev/null) || sudo apt-get install -y --no-install-recommends ffmpeg
          (sudo apt-get install -y --no-install-recommends fonts-dejavu-core > /dev/null 2>&1) || true
      - name: Make videos
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          VIDEO_CHAT_ID: ${{ secrets.VIDEO_CHAT_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          VIDEO_CTA_HANDLE: ${{ vars.VIDEO_CTA_HANDLE }}
        run: python -u make_video.py ${{ inputs.kind || 'auto' }}
      - name: Keep videos for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/
          retention-days: 3
          if-no-files-found: ignore
      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add videos.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update video state"
            git pull --rebase
            git push
          fi
